name: A0-X P133 real dual-clock command bridge RTL (not physical CDC qualification)
on:
  pull_request:
    paths:
      - 'A0-GPU/rtl/graphics/a0_p133_*.sv'
      - 'A0-GPU/rtl/graphics/tb/a0_p133_*.sv'
      - '.github/workflows/a0-p133-dual-clock-rtl.yml'
  push:
    branches: [main]
    paths:
      - 'A0-GPU/rtl/graphics/a0_p133_*.sv'
      - 'A0-GPU/rtl/graphics/tb/a0_p133_*.sv'
      - '.github/workflows/a0-p133-dual-clock-rtl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p133-real-dual-clock-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install genuine Verilog simulator with finite timeout
        run: |
          set -euo pipefail
          timeout 480s sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=25
          timeout 480s sudo apt-get install -y iverilog -o Acquire::Retries=2 -o Acquire::http::Timeout=25
          iverilog -V | head -2
      - name: Run actual two-frequency FIFO plus P132-P102 RTL
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P133
          iverilog -g2012 -s a0_p133_dual_clock_bridge_tb -o EVIDENCE/P133/p133.vvp \
            A0-GPU/rtl/graphics/a0_triangle_coverage_p38.sv \
            A0-GPU/rtl/graphics/a0_p59_scissor_coverage.sv \
            A0-GPU/rtl/graphics/a0_p68_depth_compare.sv \
            A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv \
            A0-GPU/rtl/graphics/a0_triangle_scissor_depth_blend_p102.sv \
            A0-GPU/rtl/graphics/a0_p132_command_bus.sv \
            A0-GPU/rtl/graphics/a0_p133_async_fifo.sv \
            A0-GPU/rtl/graphics/a0_p133_dual_clock_bridge.sv \
            A0-GPU/rtl/graphics/tb/a0_p133_dual_clock_bridge_tb.sv \
            2>&1 | tee EVIDENCE/P133/compile.log
          vvp EVIDENCE/P133/p133.vvp | tee EVIDENCE/P133/simulation.log
          grep -qx 'P133_REAL_DUAL_CLOCK_RTL_PASS ordered burst/backpressure/clear/readback/reset' EVIDENCE/P133/simulation.log
      - name: Stress both async FIFO widths with bounded randomized stalls and reset
        run: |
          set -euo pipefail
          iverilog -g2012 -s a0_p133_async_fifo_stress_tb -o EVIDENCE/P133/fifo-stress.vvp \
            A0-GPU/rtl/graphics/a0_p133_async_fifo.sv \
            A0-GPU/rtl/graphics/tb/a0_p133_async_fifo_stress_tb.sv \
            2>&1 | tee EVIDENCE/P133/fifo-stress-compile.log
          vvp EVIDENCE/P133/fifo-stress.vvp | tee EVIDENCE/P133/fifo-stress.log
          grep -qx 'P133_ASYNC_FIFO_STRESS_PASS widths=41,33 ordered=512x2 full/empty/stall/reset' EVIDENCE/P133/fifo-stress.log
      - name: Record bounded honest simulation-only evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("EVIDENCE/P133")
          log=(p/"simulation.log").read_text()
          assert "P133_REAL_DUAL_CLOCK_RTL_PASS" in log
          assert "P133_ASYNC_FIFO_STRESS_PASS" in (p/"fifo-stress.log").read_text()
          e={"milestone":"P133","status":"PASS","actual_rtl_simulated":True,
             "two_clock_simulation":True,"ordered_backpressure_checked":True,"fifo_41_33_stress_checked":True,
             "rtl_synthesized":False,"physical_cdc_qualified":False,
             "fpga_placed_routed":False,"board_tested":False}
          (p/"qualification.json").write_text(json.dumps(e,indent=2))
          PY
      - name: Upload real PASS or failed simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-p133-real-dual-clock-rtl-evidence
          path: EVIDENCE/P133/
          if-no-files-found: warn

  p133-real-ecp5-netlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install real Yosys with bounded package time
        run: |
          set -euo pipefail
          if ! timeout 900s sudo apt-get install -y -o Acquire::Retries=2 -o Acquire::http::Timeout=20 yosys; then
            timeout 300s sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20
            timeout 900s sudo apt-get install -y -o Acquire::Retries=2 -o Acquire::http::Timeout=20 yosys
          fi
          yosys -V
      - name: Synthesize actual full P133 bridge plus P132 and P102 for ECP5
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P133-SYNTH
          yosys -p "read_verilog -sv A0-GPU/rtl/graphics/a0_triangle_coverage_p38.sv A0-GPU/rtl/graphics/a0_p59_scissor_coverage.sv A0-GPU/rtl/graphics/a0_p68_depth_compare.sv A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv A0-GPU/rtl/graphics/a0_triangle_scissor_depth_blend_p102.sv A0-GPU/rtl/graphics/a0_p132_command_bus.sv A0-GPU/rtl/graphics/a0_p133_async_fifo.sv A0-GPU/rtl/graphics/a0_p133_dual_clock_bridge.sv; hierarchy -check -top a0_p133_dual_clock_bridge -chparam FRAME_WIDTH 4 -chparam FRAME_HEIGHT 4; synth_ecp5 -top a0_p133_dual_clock_bridge -json EVIDENCE/P133-SYNTH/p133-netlist.json; check -assert" 2>&1 | tee EVIDENCE/P133-SYNTH/yosys.log
      - name: Fail closed on unmapped cells, latch, wrong top or unbounded IO
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('EVIDENCE/P133-SYNTH')
          n=json.loads((p/'p133-netlist.json').read_text())
          assert 'a0_p133_dual_clock_bridge' in n['modules'], 'missing expected top module'
          t=n['modules']['a0_p133_dual_clock_bridge']
          assert t['ports']['host_clk']['direction']=='input'
          assert t['ports']['gpu_clk']['direction']=='input'
          assert t['ports']['host_clk']['bits'] != t['ports']['gpu_clk']['bits'], 'clock nets accidentally tied'
          io=sum(len(v['bits']) for v in t['ports'].values())
          assert 0<io<=96, f'unbounded interface: {io} bits'
          types=[v['type'] for v in t['cells'].values()]
          assert types and any('FF' in v.upper() for v in types), 'empty/no flops'
          assert not any(v.startswith('$') or v.startswith('a0_') or 'LATCH' in v.upper() for v in types), 'unmapped cell/latch'
          evidence={'milestone':'P133','result':'PASS','genuine_yosys_ecp5_synthesis':True,
                    'top_io_bits':io,'mapped_cells':len(types),'latches_or_unmapped':False,
                    'fpga_placed_routed':False,'timing_verified':False,
                    'physical_cdc_qualified':False,'board_tested':False}
          (p/'qualification.json').write_text(json.dumps(evidence,indent=2))
          print(evidence)
          PY
      - name: Upload synthesized evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-p133-real-ecp5-netlist-evidence
          path: EVIDENCE/P133-SYNTH/
          if-no-files-found: warn
