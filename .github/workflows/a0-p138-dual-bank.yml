          for kind in ('TRELLIS_COMB','TRELLIS_IO'):
              util=route['utilization'][kind]
              assert 0<util['used']<=util['available'],kind
          clocks=route['fmax']
          assert any('clk' in name for name in clocks)
          for name,c in clocks.items():
              assert c['constraint']>=5 and c['achieved']>=c['constraint'],(name,c)
          result={'milestone':'P138','status':'PASS',
