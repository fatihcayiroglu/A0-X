                  'mapped_cell_count':sum(counts.values()),'cell_types':counts,
                  'reported_fmax':clocks,
                  'onboard_RAM_inference_confirmed':counts.get('DP16KD',0)>=2,
                  'physical_IO_and_board_qualified':False,
