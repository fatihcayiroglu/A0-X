                  'reported_fmax':clocks,
                  'onboard_RAM_inference_confirmed':counts.get('DP16KD',0)>0,
                  'physical_IO_and_board_qualified':False,
                  'P102_renderer_integrated':False,
                  'real_GPU_pixel_throughput_measured':False}
