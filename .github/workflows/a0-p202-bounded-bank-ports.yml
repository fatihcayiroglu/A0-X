name: A0-X P202 bounded external bank transport guards
on:
  pull_request:
    paths:
      - 'A0-GPU/rtl/memory/a0_p202_bounded_bank_port_guard.sv'
      - 'A0-GPU/tests/rtl/a0_p202_guarded_p175_epoch_tb.sv'
      - 'A0-GPU/tests/rtl/a0_p202_bank_guard_fault_tb.sv'
      - 'A0-GPU/docs/P202-BOUNDED-BANK-PORT-GUARDS.md'
      - '.github/workflows/a0-p202-bounded-bank-ports.yml'
      - 'A0-GPU/rtl/memory/a0_p200_dual_bank_word_router.sv'
      - 'A0-GPU/rtl/memory/a0_p199_atomic_frame_bank_epoch.sv'
  push:
    branches: [main]
    paths:
      - 'A0-GPU/rtl/memory/a0_p202_bounded_bank_port_guard.sv'
      - 'A0-GPU/tests/rtl/a0_p202_guarded_p175_epoch_tb.sv'
      - 'A0-GPU/tests/rtl/a0_p202_bank_guard_fault_tb.sv'
      - '.github/workflows/a0-p202-bounded-bank-ports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p202-guarded-real-frame-epochs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Icarus and Yosys
        run: |
          set -euo pipefail
          sudo apt-get install -y iverilog yosys
      - name: Prove two actual P175 frames pass both bounded bank guards
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P202/rtl
          sources=(
            A0-GPU/rtl/texture/a0_p156_nearest_texture.sv
            A0-GPU/rtl/texture/a0_p158_bilinear_texture.sv
            A0-GPU/rtl/shader/a0_p150_unorm_simd4_alu.sv
            A0-GPU/rtl/shader/a0_p162_textured_microprogram.sv
            A0-GPU/rtl/graphics/a0_triangle_coverage_p38.sv
            A0-GPU/rtl/graphics/a0_p68_depth_compare.sv
            A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv
            A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv
            A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv
            A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv
            A0-GPU/rtl/graphics/a0_p164_affine_vertex_uv.sv
            A0-GPU/rtl/graphics/a0_p166_perspective_vertex_uv.sv
            A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv
            A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv
            A0-GPU/rtl/graphics/a0_p190_tiled_screen_uv.sv
            A0-GPU/rtl/graphics/a0_p175_scaled_programmed_fragment_core.sv
            A0-GPU/rtl/graphics/a0_p175_scaled_programmed_command_top.sv
            A0-GPU/rtl/memory/a0_p195_external_pixel_write_queue.sv
            A0-GPU/rtl/memory/a0_p197_external_word_port_arbiter.sv
            A0-GPU/rtl/memory/a0_p198_p175_frame_snapshot_export.sv
            A0-GPU/rtl/memory/a0_p199_atomic_frame_bank_epoch.sv
            A0-GPU/rtl/memory/a0_p200_dual_bank_word_router.sv
            A0-GPU/rtl/memory/a0_p201_automatic_frame_epoch_sequencer.sv
            A0-GPU/rtl/memory/a0_p202_bounded_bank_port_guard.sv
            A0-GPU/tests/rtl/models/a0_p196_external_word_memory_model.sv
          )
          iverilog -g2012 -Wall -s a0_p202_guarded_p175_epoch_tb \
            -o EVIDENCE/P202/rtl/p202_full.vvp \
            "${sources[@]}" A0-GPU/tests/rtl/a0_p202_guarded_p175_epoch_tb.sv
          timeout 1200s vvp EVIDENCE/P202/rtl/p202_full.vvp \
            | tee EVIDENCE/P202/rtl/p202_full.log
          grep -q '^P202_GUARDED_P175_EPOCH_PASS frame=256x256 epochs=2 exported=131072 old_reads=200 auto_begin=1 auto_seal=1 atomic_publish=1 reset_fail_closed=1$' \
            EVIDENCE/P202/rtl/p202_full.log
      - name: Fault-inject missing responses, wrong bank, stale replies and stalls
        run: |
          set -euo pipefail
          iverilog -g2012 -Wall -s a0_p202_bank_guard_fault_tb \
            -o EVIDENCE/P202/rtl/p202_negative.vvp \
            A0-GPU/rtl/memory/a0_p202_bounded_bank_port_guard.sv \
            A0-GPU/tests/rtl/a0_p202_bank_guard_fault_tb.sv
          timeout 60s vvp EVIDENCE/P202/rtl/p202_negative.vvp \
            | tee EVIDENCE/P202/rtl/p202_negative.log
          grep -q '^P202_BANK_GUARD_FAULT_PASS delayed_read=1 bounded_write_stall=1 read_timeout=1 single_error_reply=1 late_quarantine=1 unsolicited=1 wrong_bank=1 stalled_write=1 backend_error=1 overlap=1$' \
            EVIDENCE/P202/rtl/p202_negative.log
      - name: Synthesize bank transport guard and require zero structural problems
        run: |
          set -euo pipefail
          yosys -Q -T -p 'read_verilog -sv A0-GPU/rtl/memory/a0_p202_bounded_bank_port_guard.sv; hierarchy -check -top a0_p202_bounded_bank_port_guard; synth -top a0_p202_bounded_bank_port_guard; check -assert; stat' \
            | tee EVIDENCE/P202/rtl/p202_yosys.log
          grep -q 'Found and reported 0 problems.' EVIDENCE/P202/rtl/p202_yosys.log
          grep -q '=== a0_p202_bounded_bank_port_guard ===' EVIDENCE/P202/rtl/p202_yosys.log
      - name: Preserve first-failure output without retries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p202-bounded-bank-port-evidence
          path: EVIDENCE/P202/rtl
          if-no-files-found: warn
