name: A0-X P191 real tiled 256-wide and 256-tall host framebuffer
on:
  pull_request:
    paths:
      - 'A0-GPU/rtl/graphics/a0_p175_scaled_programmed_fragment_core.sv'
      - 'A0-GPU/rtl/graphics/a0_p175_scaled_programmed_command_top.sv'
      - 'A0-GPU/rtl/graphics/a0_p190_tiled_screen_uv.sv'
      - 'A0-GPU/tests/rtl/a0_p191_tiled_programmed_frame_tb.sv'
      - 'A0-GPU/docs/P191-TILED-PROGRAMMED-RENDERER.md'
      - '.github/workflows/a0-p191-tiled-programmed-frame.yml'
  push:
    branches: [main]
    paths:
      - 'A0-GPU/rtl/graphics/a0_p175_scaled_programmed_fragment_core.sv'
      - 'A0-GPU/rtl/graphics/a0_p175_scaled_programmed_command_top.sv'
      - 'A0-GPU/rtl/graphics/a0_p190_tiled_screen_uv.sv'
      - 'A0-GPU/tests/rtl/a0_p191_tiled_programmed_frame_tb.sv'
      - '.github/workflows/a0-p191-tiled-programmed-frame.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p191-high-coordinate-host-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install real Icarus simulator
        run: |
          set -euo pipefail
          sudo apt-get install -y iverilog
      - name: Prove global framebuffer and local Q8.8 shader coordinates on both axes
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P191/rtl
          sources=(
            A0-GPU/rtl/texture/a0_p156_nearest_texture.sv
            A0-GPU/rtl/texture/a0_p158_bilinear_texture.sv
            A0-GPU/rtl/shader/a0_p150_unorm_simd4_alu.sv
            A0-GPU/rtl/shader/a0_p162_textured_microprogram.sv
            A0-GPU/rtl/graphics/a0_triangle_coverage_p38.sv
            A0-GPU/rtl/graphics/a0_p68_depth_compare.sv
            A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv
            A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv
            A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv
            A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv
            A0-GPU/rtl/graphics/a0_p164_affine_vertex_uv.sv
            A0-GPU/rtl/graphics/a0_p166_perspective_vertex_uv.sv
            A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv
            A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv
            A0-GPU/rtl/graphics/a0_p190_tiled_screen_uv.sv
            A0-GPU/rtl/graphics/a0_p175_scaled_programmed_fragment_core.sv
            A0-GPU/rtl/graphics/a0_p175_scaled_programmed_command_top.sv
          )
          for geometry in '256 4' '4 256'; do
            read -r w h <<< "$geometry"
            iverilog -g2012 -s a0_p191_tiled_programmed_frame_tb \
              -P a0_p191_tiled_programmed_frame_tb.W="$w" \
              -P a0_p191_tiled_programmed_frame_tb.H="$h" \
              -o "EVIDENCE/P191/rtl/tiled_${w}x${h}.vvp" \
              "${sources[@]}" A0-GPU/tests/rtl/a0_p191_tiled_programmed_frame_tb.sv
            timeout 120s vvp "EVIDENCE/P191/rtl/tiled_${w}x${h}.vvp" \
              | tee "EVIDENCE/P191/rtl/tiled_${w}x${h}.log"
            grep -q "^P191_TILED_PROGRAMMED_FRAME_PASS shape=${w}x${h} " \
              "EVIDENCE/P191/rtl/tiled_${w}x${h}.log"
          done
      - name: Preserve simulation evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p191-high-coordinate-host-rtl
          path: EVIDENCE/P191/rtl
          if-no-files-found: warn
  p191-physical-256x4-ecp5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install real ECP5 synthesis and route tools
        run: |
          set -euo pipefail
          sudo apt-get install -y yosys nextpnr-ecp5
      - name: Physical 256-wide opt-in renderer fit at >=30MHz
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P191/route
          yosys -p "read_verilog -sv A0-GPU/rtl/texture/a0_p156_nearest_texture.sv A0-GPU/rtl/texture/a0_p158_bilinear_texture.sv A0-GPU/rtl/shader/a0_p150_unorm_simd4_alu.sv A0-GPU/rtl/shader/a0_p162_textured_microprogram.sv A0-GPU/rtl/graphics/a0_triangle_coverage_p38.sv A0-GPU/rtl/graphics/a0_p68_depth_compare.sv A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv A0-GPU/rtl/graphics/a0_p164_affine_vertex_uv.sv A0-GPU/rtl/graphics/a0_p166_perspective_vertex_uv.sv A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv A0-GPU/rtl/graphics/a0_p190_tiled_screen_uv.sv A0-GPU/rtl/graphics/a0_p175_scaled_programmed_fragment_core.sv A0-GPU/rtl/graphics/a0_p175_scaled_programmed_command_top.sv; chparam -set FRAME_WIDTH 256 -set FRAME_HEIGHT 4 -set TILED_SCREEN_UV 1 a0_p175_scaled_programmed_command_top; hierarchy -check -top a0_p175_scaled_programmed_command_top; synth_ecp5 -top a0_p175_scaled_programmed_command_top -json EVIDENCE/P191/route/netlist.json; check -assert" \
            2>&1 | tee EVIDENCE/P191/route/yosys.log
          nextpnr-ecp5 --85k --package CABGA756 --speed 6 \
            --json EVIDENCE/P191/route/netlist.json \
            --textcfg EVIDENCE/P191/route/route.config \
            --report EVIDENCE/P191/route/route.json \
            --freq 5 --lpf-allow-unconstrained --seed 1 \
            2>&1 | tee EVIDENCE/P191/route/nextpnr.log
          python3 - <<'PY'
          import collections,json
          from pathlib import Path
          p=Path('EVIDENCE/P191/route')
          m=json.loads((p/'netlist.json').read_text())['modules']['a0_p175_scaled_programmed_command_top']
          pins=sum(len(v['bits']) for v in m['ports'].values())
          c=collections.Counter(v['type'] for v in m['cells'].values())
          assert pins==77,('P191 host IO regression',pins)
          assert 5<=c.get('DP16KD',0)<=32,('P191 invalid framebuffer BRAM',c)
          assert 40<=c.get('MULT18X18D',0)<=72,('P191 shader DSP absent or overfull',c)
          assert 0<c.get('TRELLIS_FF',0)<9195,('P191 FF placement not bounded',c)
          assert 0<c.get('LUT4',0)<=83640,('P191 LUT4 evidence invalid',c)
          assert not any(k.startswith('$') or k.startswith('a0_') or 'LATCH' in k.upper() for k in c),c
          fmax=json.loads((p/'route.json').read_text())['fmax']
          assert fmax and all(v.get('achieved',0)>=30 for v in fmax.values()),('P191 route missed 30MHz floor',fmax)
          mhz=min(v['achieved'] for v in fmax.values())
          print('P191_REAL_256X4_ECP5_ROUTE_PASS pins=%d pixels=1024 BRAM=%d DSP=%d LUT4=%d FF=%d MHz=%.2f'%(pins,c['DP16KD'],c['MULT18X18D'],c['LUT4'],c['TRELLIS_FF'],mhz))
          PY
      - name: Preserve physical artifacts even when red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p191-real-256x4-ecp5
          path: EVIDENCE/P191/route
          if-no-files-found: warn
