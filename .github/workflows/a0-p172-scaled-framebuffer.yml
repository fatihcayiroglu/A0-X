name: A0-X P172/P176 scaled 8x8 through 32x32 programmed framebuffer
on:
  pull_request:
    paths:
      - 'A0-GPU/tests/rtl/a0_p172_scaled_programmed_fragment_p102_tb.sv'
      - 'A0-GPU/docs/P172-SCALED-PROGRAMMED-FRAMEBUFFER.md'
      - 'A0-GPU/docs/P176-LARGER-FRAME-ORACLES.md'
      - '.github/workflows/a0-p172-scaled-framebuffer.yml'
      - 'A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv'
      - 'A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv'
      - 'A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv'
      - 'A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv'
      - 'A0-GPU/rtl/graphics/a0_p175_scaled_programmed_fragment_core.sv'
      - 'A0-GPU/rtl/graphics/a0_p175_scaled_programmed_command_top.sv'
      - 'A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv'
  push:
    branches: [main]
    paths:
      - 'A0-GPU/tests/rtl/a0_p172_scaled_programmed_fragment_p102_tb.sv'
      - '.github/workflows/a0-p172-scaled-framebuffer.yml'
      - 'A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv'
      - 'A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv'
      - 'A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv'
      - 'A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv'
      - 'A0-GPU/rtl/graphics/a0_p175_scaled_programmed_fragment_core.sv'
      - 'A0-GPU/rtl/graphics/a0_p175_scaled_programmed_command_top.sv'
      - 'A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p172-scaled-p102-programmed-frame-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install real Icarus RTL simulator
        run: |
          set -euo pipefail
          sudo apt-get install -y iverilog
      - name: Prove exact host-visible 8x8 and 16x16 framebuffer versus P102
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P172/rtl
          for shape in '8 8' '16 16' '32 16' '16 32' '32 32'; do
            read -r w h <<< "$shape"
            id="${w}x${h}"
          iverilog -g2012 -s a0_p172_scaled_programmed_fragment_p102_tb \
            -Pa0_p172_scaled_programmed_fragment_p102_tb.W="$w" \
            -Pa0_p172_scaled_programmed_fragment_p102_tb.H="$h" \
            -o EVIDENCE/P172/rtl/$id.vvp \
            A0-GPU/rtl/texture/a0_p156_nearest_texture.sv \
            A0-GPU/rtl/texture/a0_p158_bilinear_texture.sv \
            A0-GPU/rtl/shader/a0_p150_unorm_simd4_alu.sv \
            A0-GPU/rtl/shader/a0_p162_textured_microprogram.sv \
            A0-GPU/rtl/graphics/a0_triangle_coverage_p38.sv \
            A0-GPU/rtl/graphics/a0_p59_scissor_coverage.sv \
            A0-GPU/rtl/graphics/a0_p68_depth_compare.sv \
            A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv \
            A0-GPU/rtl/graphics/a0_triangle_scissor_depth_blend_p102.sv \
            A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv \
            A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv \
            A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv \
            A0-GPU/rtl/graphics/a0_p164_affine_vertex_uv.sv \
            A0-GPU/rtl/graphics/a0_p166_perspective_vertex_uv.sv \
            A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv \
            A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv \
            A0-GPU/rtl/graphics/a0_p175_scaled_programmed_fragment_core.sv \
            A0-GPU/rtl/graphics/a0_p175_scaled_programmed_command_top.sv \
            A0-GPU/tests/rtl/a0_p172_scaled_programmed_fragment_p102_tb.sv \
            2>&1 | tee "EVIDENCE/P172/rtl/$id-compile.log"
            timeout 180s vvp "EVIDENCE/P172/rtl/$id.vvp" | tee "EVIDENCE/P172/rtl/$id.log"
            grep -q "^P172_SCALED_PROGRAMMED_P102_PASS shape=$id " "EVIDENCE/P172/rtl/$id.log"
          done
      - name: Enforce exact full-frame counts and nonvacuous shader/fault checks
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for w,h in ((8,8),(16,16),(32,16),(16,32),(32,32)):
              log=(Path('EVIDENCE/P172/rtl')/f'{w}x{h}.log').read_text()
              lines=re.findall(r'^P172_SCALED_PROGRAMMED_P102_PASS shape=(\d+)x(\d+) txns=(\d+) tex_writes=(\d+) insn_writes=(\d+) seed_writes=(\d+) clears=(\d+) draws=(\d+) full_frame_pixels=(\d+) covered=(\d+) host_rejections=(\d+) busy_denials=(\d+) missing_faults=(\d+)$',log,re.M)
              assert len(lines)==1,(w,h,log[-300:])
              a=list(map(int,lines[0]))
              assert a[0:2]==[w,h]
              assert a[3]==256 and a[6]==3 and a[7]==2
              assert a[8]==5*w*h and a[9]==2*w*h
              assert a[10]>=8 and a[11]==1 and a[12]==1
              assert a[2]>=4*w*h, a
              print(f'P172_HOST_SCALING_PASS width={w} height={h} verified_pixels={a[8]} covered={a[9]}')
          print('P176_LARGE_AND_ASYMMETRIC_FRAMEBUFFER_ORACLE_PASS shapes=5 larger_shapes=3 all_pixels_checked=11840')
          PY
      - name: Preserve exact simulation artifacts on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p172-scaled-real-p102-programmed-rtl
          path: EVIDENCE/P172/rtl
          if-no-files-found: warn
  p172-routed-16x16-ecp5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install actual ECP5 synthesis and place-route tools
        run: |
          set -euo pipefail
          sudo apt-get install -y yosys nextpnr-ecp5
      - name: Prove real BRAM and DSP inside full programmable fragment host top
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P172/route
          yosys -p "read_verilog -sv A0-GPU/rtl/texture/a0_p156_nearest_texture.sv A0-GPU/rtl/texture/a0_p158_bilinear_texture.sv A0-GPU/rtl/shader/a0_p150_unorm_simd4_alu.sv A0-GPU/rtl/shader/a0_p162_textured_microprogram.sv A0-GPU/rtl/graphics/a0_triangle_coverage_p38.sv A0-GPU/rtl/graphics/a0_p68_depth_compare.sv A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv A0-GPU/rtl/graphics/a0_p164_affine_vertex_uv.sv A0-GPU/rtl/graphics/a0_p166_perspective_vertex_uv.sv A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv A0-GPU/rtl/graphics/a0_p175_scaled_programmed_fragment_core.sv A0-GPU/rtl/graphics/a0_p175_scaled_programmed_command_top.sv; chparam -set FRAME_WIDTH 16 -set FRAME_HEIGHT 16 a0_p175_scaled_programmed_command_top; hierarchy -check -top a0_p175_scaled_programmed_command_top; synth_ecp5 -top a0_p175_scaled_programmed_command_top -json EVIDENCE/P172/route/netlist.json; check -assert" 2>&1 | tee EVIDENCE/P172/route/yosys.log
          nextpnr-ecp5 --85k --package CABGA756 --speed 6 \
            --json EVIDENCE/P172/route/netlist.json \
            --textcfg EVIDENCE/P172/route/route.config \
            --report EVIDENCE/P172/route/route.json \
            --freq 5 --lpf-allow-unconstrained --seed 1 \
            2>&1 | tee EVIDENCE/P172/route/nextpnr.log
          python3 - <<'PY'
          import collections,json
          from pathlib import Path
          p=Path('EVIDENCE/P172/route')
          m=json.loads((p/'netlist.json').read_text())['modules']['a0_p175_scaled_programmed_command_top']
          pins=sum(len(v['bits']) for v in m['ports'].values())
          c=collections.Counter(v['type'] for v in m['cells'].values())
          assert pins==77,('full host control bus must fit 77 real IO pins',pins)
          assert c.get('DP16KD',0)==5,('P175 scaled core must preserve five real BRAMs',c)
          assert c.get('MULT18X18D',0)>=40,('P162 texture or ALU DSP missing',c)
          assert c.get('MULT18X18D',0)<=72,('P172 exceeded P171 72-DSP budget',c)
          assert not any(k.startswith('$') or k.startswith('a0_') or 'LATCH' in k.upper() for k in c),c
          fmax=json.loads((p/'route.json').read_text())['fmax']
          assert fmax and all(v['achieved']>=15 for v in fmax.values()),('P172 16x16 FPGA frequency <15MHz',fmax)
          assert all(v['achieved']>=36.5 for v in fmax.values()),('P175 scaled ECP5 Fmax below 36.5MHz',fmax)
          achieved_mhz=min(v['achieved'] for v in fmax.values())
          print('P172_SCALED_16X16_ECP5_PASS pins=%d pixels=256 BRAM=%d DSP=%d MHz=%.2f'%(pins,c['DP16KD'],c['MULT18X18D'],achieved_mhz))
          PY
      - name: Preserve routed bitstream and mapped evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p172-scaled-real-programmed-raster-ecp5
          path: EVIDENCE/P172/route
          if-no-files-found: warn
