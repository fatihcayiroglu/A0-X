name: A0-X P165 affine programmed fragment pipeline
on:
  pull_request:
    paths:
      - 'A0-GPU/rtl/graphics/a0_p164_affine_vertex_uv.sv'
      - 'A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv'
      - 'A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv'
      - 'A0-GPU/tests/rtl/a0_p165_affine_programmed_fragment_p102_tb.sv'
      - 'A0-GPU/rtl/shader/a0_p162_textured_microprogram.sv'
      - 'A0-GPU/rtl/texture/a0_p158_bilinear_texture.sv'
      - 'A0-GPU/docs/P165-AFFINE-PROGRAMMED-FRAGMENTS.md'
      - '.github/workflows/a0-p165-affine-programmed-fragments.yml'
  push:
    branches: [main]
    paths:
      - 'A0-GPU/rtl/graphics/a0_p164_affine_vertex_uv.sv'
      - 'A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv'
      - 'A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv'
      - '.github/workflows/a0-p165-affine-programmed-fragments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p165-real-p102-programmed-frame-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install real Icarus RTL simulator
        run: |
          set -euo pipefail
          sudo apt-get install -y iverilog
      - name: Validate full 4x4 RGB/depth against independent P102 and scalar TEX/ALU
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P165/rtl
          iverilog -g2012 -s a0_p165_affine_programmed_fragment_p102_tb \
            -o EVIDENCE/P165/rtl/programmed.vvp \
            A0-GPU/rtl/texture/a0_p156_nearest_texture.sv \
            A0-GPU/rtl/texture/a0_p158_bilinear_texture.sv \
            A0-GPU/rtl/shader/a0_p150_unorm_simd4_alu.sv \
            A0-GPU/rtl/shader/a0_p162_textured_microprogram.sv \
            A0-GPU/rtl/graphics/a0_triangle_coverage_p38.sv \
            A0-GPU/rtl/graphics/a0_p59_scissor_coverage.sv \
            A0-GPU/rtl/graphics/a0_p68_depth_compare.sv \
            A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv \
            A0-GPU/rtl/graphics/a0_triangle_scissor_depth_blend_p102.sv \
            A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv \
            A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv \
            A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv \
            A0-GPU/rtl/graphics/a0_p164_affine_vertex_uv.sv \
            A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv \
            A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv \
            A0-GPU/tests/rtl/a0_p165_affine_programmed_fragment_p102_tb.sv \
            2>&1 | tee EVIDENCE/P165/rtl/compile.log
          timeout 180s vvp EVIDENCE/P165/rtl/programmed.vvp | tee EVIDENCE/P165/rtl/result.log
          grep -q '^P165_AFFINE_PROGRAMMED_P102_PASS ' EVIDENCE/P165/rtl/result.log
          # Three clears + three drawn frames plus two reset fault clears.
          grep -q 'full_frame_pixels=128 ' EVIDENCE/P165/rtl/result.log
          grep -q 'missing_faults=1' EVIDENCE/P165/rtl/result.log
          grep -q 'snapshots=1 uv_overflow_faults=1' EVIDENCE/P165/rtl/result.log
      - name: Preserve exact simulation artifacts on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p165-real-p102-programmed-rtl
          path: EVIDENCE/P165/rtl
          if-no-files-found: warn
  p165-fully-routed-77io-ecp5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install actual ECP5 synthesis and place-route tools
        run: |
          set -euo pipefail
          sudo apt-get install -y yosys nextpnr-ecp5
      - name: Prove real BRAM and DSP inside full programmable fragment host top
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P165/route
          yosys -p "read_verilog -sv A0-GPU/rtl/texture/a0_p156_nearest_texture.sv A0-GPU/rtl/texture/a0_p158_bilinear_texture.sv A0-GPU/rtl/shader/a0_p150_unorm_simd4_alu.sv A0-GPU/rtl/shader/a0_p162_textured_microprogram.sv A0-GPU/rtl/graphics/a0_triangle_coverage_p38.sv A0-GPU/rtl/graphics/a0_p68_depth_compare.sv A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv A0-GPU/rtl/graphics/a0_p164_affine_vertex_uv.sv A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv; hierarchy -check -top a0_p163_packed_programmed_command_top; synth_ecp5 -top a0_p163_packed_programmed_command_top -json EVIDENCE/P165/route/netlist.json; check -assert" 2>&1 | tee EVIDENCE/P165/route/yosys.log
          nextpnr-ecp5 --85k --package CABGA756 --speed 6 \
            --json EVIDENCE/P165/route/netlist.json \
            --textcfg EVIDENCE/P165/route/route.config \
            --report EVIDENCE/P165/route/route.json \
            --freq 5 --lpf-allow-unconstrained --seed 1 \
            2>&1 | tee EVIDENCE/P165/route/nextpnr.log
          python3 - <<'PY'
          import collections,json
          from pathlib import Path
          p=Path('EVIDENCE/P165/route')
          m=json.loads((p/'netlist.json').read_text())['modules']['a0_p163_packed_programmed_command_top']
          pins=sum(len(v['bits']) for v in m['ports'].values())
          c=collections.Counter(v['type'] for v in m['cells'].values())
          assert pins==77,('full host control bus must fit 77 real IO pins',pins)
          assert c.get('DP16KD',0)>=3,('P156 and P144 BRAM missing',c)
          assert c.get('MULT18X18D',0)>=18,('P162 texture or ALU DSP missing',c)
          assert not any(k.startswith('$') or k.startswith('a0_') or 'LATCH' in k.upper() for k in c),c
          fmax=json.loads((p/'route.json').read_text())['fmax']
          assert fmax and all(v['achieved']>=5 for v in fmax.values()),fmax
          print('P165_FULL_AFFINE_RASTER_ECP5_PASS pins=%d BRAM=%d DSP=%d'%(pins,c['DP16KD'],c['MULT18X18D']))
          PY
      - name: Preserve routed bitstream and mapped evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p165-real-programmed-raster-ecp5
          path: EVIDENCE/P165/route
          if-no-files-found: warn
