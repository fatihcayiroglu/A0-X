name: A0-X P149 tagged epochs watchdog and full ECP5 BRAM
on:
  pull_request:
    paths:
      - 'A0-GPU/rtl/graphics/a0_p149_epoch_tagged_host_link.sv'
      - 'A0-GPU/tests/rtl/a0_p149_tagged_p102_diff_tb.sv'
      - 'A0-GPU/tests/rtl/a0_p149_epoch_id_stress_tb.sv'
      - 'A0-GPU/tests/rtl/a0_p149_watchdog_recovery_tb.sv'
      - 'A0-GPU/docs/P149-EPOCH-TAGGED-LINK-RECOVERY.md'
      - '.github/workflows/a0-p149-epoch-tagged-link.yml'
  push:
    branches: [main]
    paths:
      - 'A0-GPU/rtl/graphics/a0_p149_epoch_tagged_host_link.sv'
      - 'A0-GPU/tests/rtl/a0_p149_tagged_p102_diff_tb.sv'
      - 'A0-GPU/tests/rtl/a0_p149_epoch_id_stress_tb.sv'
      - 'A0-GPU/tests/rtl/a0_p149_watchdog_recovery_tb.sv'
      - '.github/workflows/a0-p149-epoch-tagged-link.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p149-real-tagged-RAM-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install real Icarus HDL simulator
        run: |
          set -euo pipefail
          if ! timeout 600s sudo apt-get install -y -o Acquire::Retries=2 -o Acquire::http::Timeout=20 iverilog; then
            timeout 240s sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20
            timeout 600s sudo apt-get install -y -o Acquire::Retries=2 -o Acquire::http::Timeout=20 iverilog
          fi
          iverilog -V | head -2
      - name: Stress real tagged FIFO and injected-timeout recovery
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P149/rtl
          sources=(
            A0-GPU/rtl/graphics/a0_triangle_coverage_p38.sv
            A0-GPU/rtl/graphics/a0_p59_scissor_coverage.sv
            A0-GPU/rtl/graphics/a0_p68_depth_compare.sv
            A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv
            A0-GPU/rtl/graphics/a0_triangle_scissor_depth_blend_p102.sv
            A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv
            A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv
            A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv
            A0-GPU/rtl/graphics/a0_p145_dual_raster_depth_blend_trial.sv
            A0-GPU/rtl/graphics/a0_p147_packed_command_top.sv
            A0-GPU/rtl/graphics/a0_p148_ordered_host_queue_top.sv
            A0-GPU/rtl/graphics/a0_p149_epoch_tagged_host_link.sv
          )
          for testname in a0_p149_epoch_id_stress_tb a0_p149_watchdog_recovery_tb; do
            iverilog -g2012 -s "$testname" \
              -o "EVIDENCE/P149/rtl/$testname.vvp" "${sources[@]}" \
              "A0-GPU/tests/rtl/$testname.sv" \
              2>&1 | tee "EVIDENCE/P149/rtl/$testname-compile.log"
            timeout 120s vvp "EVIDENCE/P149/rtl/$testname.vvp" | tee "EVIDENCE/P149/rtl/$testname.log"
          done
          grep -q '^P149_TAGGED_ORDERED_HOST_FIFO_PASS ' EVIDENCE/P149/rtl/a0_p149_epoch_id_stress_tb.log
          grep -q '^P149_WATCHDOG_RECOVERY_PASS ' EVIDENCE/P149/rtl/a0_p149_watchdog_recovery_tb.log
          for shape in '4 4' '7 5' '8 8'; do
            read -r w h <<< "$shape"
            id="${w}x${h}"
            iverilog -g2012 -s a0_p149_tagged_p102_diff_tb \
              -Pa0_p149_tagged_p102_diff_tb.FRAME_WIDTH="$w" \
              -Pa0_p149_tagged_p102_diff_tb.FRAME_HEIGHT="$h" \
              -o "EVIDENCE/P149/rtl/$id.vvp" "${sources[@]}" \
              A0-GPU/tests/rtl/a0_p149_tagged_p102_diff_tb.sv \
              2>&1 | tee "EVIDENCE/P149/rtl/$id-compile.log"
            timeout 120s vvp "EVIDENCE/P149/rtl/$id.vvp" | tee "EVIDENCE/P149/rtl/$id.log"
            grep -q '^P149_TAGGED_FULL16_P102_PASS ' "EVIDENCE/P149/rtl/$id.log"
          done
      - name: Strictly validate tag, epoch, watchdog and P102 evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('EVIDENCE/P149/rtl')
          tag=(p/'a0_p149_epoch_id_stress_tb.log').read_text()
          recover=(p/'a0_p149_watchdog_recovery_tb.log').read_text()
          pattern=r'^P149_TAGGED_ORDERED_HOST_FIFO_PASS depth=(\d+) burst_requests=(\d+) full_stalls=(\d+) held_response_cycles=(\d+) cancelled_epoch_requests=(\d+) post_reset_reads=(\d+) ordered_rejected=(\d+)$'
          m=re.findall(pattern,tag,re.M)
          assert len(m)==1,(m,tag[-400:])
          depth,burst,full,held,cancel,post,errors=map(int,m[0])
          assert depth==4 and burst==365 and full>=12 and held>=12
          assert cancel==5 and post==2 and errors>=121
          pattern2=r'^P149_WATCHDOG_RECOVERY_PASS watchdog=(\d+) fault_injected=(\d+) link_resets=(\d+) new_epoch=(\d+) recovered_responses=(\d+) rejected=(\d+) poweron_epoch=(\d+)$'
          m2=re.findall(pattern2,recover,re.M)
          assert len(m2)==1,(m2,recover[-400:])
          wd,injected,resets,epoch,replies,failed,power=map(int,m2[0])
          assert (wd,injected,resets,epoch,replies,failed,power)==(16,1,1,1,3,1,0)
          picture={}
          pattern3=r'^P149_TAGGED_FULL16_P102_PASS size=(\d+)x(\d+) clears=(\d+) draws=(\d+) large_vertices=(\d+) frame_pixels_checked=(\d+) bus_txns=(\d+) rejected=(\d+) dual_commits=(\d+)$'
          for shape,pixels in [('4x4',16),('7x5',35),('8x8',64)]:
              output=(p/f'{shape}.log').read_text()
              mm=re.findall(pattern3,output,re.M)
              assert len(mm)==1,(shape,output[-400:])
              w,h,clears,draws,wide,pixels_checked,transactions,rejected,dual=map(int,mm[0])
              assert f'{w}x{h}'==shape
              assert clears==2 and draws==5 and wide>=4
              assert pixels_checked>=7*pixels and transactions>=7*pixels*4
              assert rejected>=15 and dual>=1
              picture[shape]={'rgb_depth_pixels_compared':pixels_checked,
                              'real_host_transactions':transactions,
                              'full_16bit_vertex_draws':wide}
          (p/'qualification.json').write_text(json.dumps({
            'milestone':'P149','status':'PASS',
            'actual_iverilog':True,'ordered_tagged_requests':burst,
            'soft_reset_epoch':epoch,'deliberate_timeout_fault_injection':True,
            'fresh_replies_after_link_reset':replies,
            'independent_P102_full_frame_shapes':picture,
            'physical_PCIe_or_hardware_FPS':False
          },indent=2))
          print('P149_TAGGED_FIFO_WATCHDOG_P102_GATE_PASS real RTL zero skips')
          PY
      - name: Upload all RTL results on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p149-real-tagged-epoch-rtl
          path: EVIDENCE/P149/rtl/
          if-no-files-found: warn

  p149-complete-ECP5-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install real Yosys and nextpnr ECP5
        run: |
          set -euo pipefail
          if ! timeout 900s sudo apt-get install -y -o Acquire::Retries=2 -o Acquire::http::Timeout=20 yosys nextpnr-ecp5; then
            timeout 300s sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20
            timeout 900s sudo apt-get install -y -o Acquire::Retries=2 -o Acquire::http::Timeout=20 yosys nextpnr-ecp5
          fi
          yosys -V
          nextpnr-ecp5 --version
      - name: Synthesize actual tagged link, FIFO, raster and dual bank BRAM
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P149/route
          yosys -p "read_verilog -sv A0-GPU/rtl/graphics/a0_p59_scissor_coverage.sv A0-GPU/rtl/graphics/a0_p68_depth_compare.sv A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv A0-GPU/rtl/graphics/a0_p145_dual_raster_depth_blend_trial.sv A0-GPU/rtl/graphics/a0_p147_packed_command_top.sv A0-GPU/rtl/graphics/a0_p148_ordered_host_queue_top.sv A0-GPU/rtl/graphics/a0_p149_epoch_tagged_host_link.sv; hierarchy -check -top a0_p149_epoch_tagged_host_link -chparam FRAME_WIDTH 4 -chparam FRAME_HEIGHT 4; synth_ecp5 -top a0_p149_epoch_tagged_host_link -json EVIDENCE/P149/route/netlist.json; check -assert" 2>&1 | tee EVIDENCE/P149/route/yosys.log
      - name: Place and route complete real ECP5-85K single-clock top
        run: |
          set -euo pipefail
          nextpnr-ecp5 --85k --package CABGA756 --speed 6 \
            --json EVIDENCE/P149/route/netlist.json \
            --textcfg EVIDENCE/P149/route/route.config \
            --report EVIDENCE/P149/route/route.json \
            --freq 5 --lpf-allow-unconstrained --seed 1 \
            2>&1 | tee EVIDENCE/P149/route/nextpnr.log
      - name: Require exact port budget, FPGA BRAM, mapped timing and no latches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import collections,json
          p=Path('EVIDENCE/P149/route')
          m=json.loads((p/'netlist.json').read_text())['modules']['a0_p149_epoch_tagged_host_link']
          io=sum(len(v['bits']) for v in m['ports'].values())
          assert io==111,('P149 logical port budget mismatch',io)
          c=collections.Counter(v['type'] for v in m['cells'].values())
          assert c.get('DP16KD',0)>=2,'P149 real ECP5 FPGA block RAM missing'
          assert not any(k.startswith('$') or k.startswith('a0_') or 'LATCH' in k.upper() for k in c),c
          route=json.loads((p/'route.json').read_text())
          for kind in ('TRELLIS_IO','TRELLIS_COMB'):
              u=route['utilization'][kind]
              assert 0<u['used']<=u['available'],(kind,u)
          assert route['utilization']['TRELLIS_IO']['used']<=128
          clocks=route['fmax']
          assert clocks and any('clk' in x for x in clocks)
          for name,v in clocks.items():
              assert v['constraint']>=5 and v['achieved']>=v['constraint'],(name,v)
          (p/'qualification.json').write_text(json.dumps({
            'milestone':'P149','status':'PASS','actual_ECP5_route':True,
            'top_io_bits':io,'mapped_DP16KD':c['DP16KD'],
            'mapped_cells':sum(c.values()),'fmax_tool_report':clocks,
            'external_pins_constrained':False,'physical_board_tested':False,
            'PCIe':False
          },indent=2))
          print('P149_ECP5_EPOCH_TAGGED_BRIDGE_PASS exact 111 IO genuine BRAM')
          print('P149_MAPPED_DP16KD',c['DP16KD'])
          for name,v in clocks.items():print('P149_ESTIMATED_FMAX_MHZ',v['achieved'])
          PY
      - name: Save complete synthesis and routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p149-real-ecp5-epoch-route
          path: EVIDENCE/P149/route/
          if-no-files-found: warn
