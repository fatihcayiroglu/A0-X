name: A0-X P168 shared affine/perspective UV engine resource consolidation
on:
  pull_request:
    paths:
      - 'A0-GPU/rtl/graphics/a0_p166_perspective_vertex_uv.sv'
      - 'A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv'
      - 'A0-GPU/tests/rtl/a0_p168_shared_affine_uv_tb.sv'
      - 'A0-GPU/docs/P168-SHARED-UV-RESOURCE-OPTIMIZATION.md'
      - '.github/workflows/a0-p168-shared-uv.yml'
  push:
    branches: [main]
    paths:
      - 'A0-GPU/rtl/graphics/a0_p166_perspective_vertex_uv.sv'
      - 'A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv'
      - '.github/workflows/a0-p168-shared-uv.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p168-shared-fast-affine-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install real Icarus RTL simulator
        run: |
          set -euo pipefail
          sudo apt-get install -y iverilog
      - name: Compare shared affine fast path to separately validated P164 hardware
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P168/rtl
          iverilog -g2012 -s a0_p168_shared_affine_uv_tb \
            -o EVIDENCE/P168/rtl/shared-affine.vvp \
            A0-GPU/rtl/graphics/a0_p164_affine_vertex_uv.sv \
            A0-GPU/rtl/graphics/a0_p166_perspective_vertex_uv.sv \
            A0-GPU/tests/rtl/a0_p168_shared_affine_uv_tb.sv \
            2>&1 | tee EVIDENCE/P168/rtl/compile.log
          timeout 180s vvp EVIDENCE/P168/rtl/shared-affine.vvp | tee EVIDENCE/P168/rtl/result.log
          grep -q '^P168_SHARED_AFFINE_UV_PASS cases=1025 ' EVIDENCE/P168/rtl/result.log
          grep -q 'reset_abort=1' EVIDENCE/P168/rtl/result.log
      - name: Preserve comparison evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p168-shared-affine-rtl
          path: EVIDENCE/P168/rtl
          if-no-files-found: warn
  p168-fully-routed-77io-ecp5:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install actual ECP5 synthesis and place-route tools
        run: |
          set -euo pipefail
          sudo apt-get install -y yosys nextpnr-ecp5
      - name: Prove real BRAM and DSP inside full programmable fragment host top
        run: |
          set -euo pipefail
          mkdir -p EVIDENCE/P168/route
          yosys -p "read_verilog -sv A0-GPU/rtl/texture/a0_p156_nearest_texture.sv A0-GPU/rtl/texture/a0_p158_bilinear_texture.sv A0-GPU/rtl/shader/a0_p150_unorm_simd4_alu.sv A0-GPU/rtl/shader/a0_p162_textured_microprogram.sv A0-GPU/rtl/graphics/a0_triangle_coverage_p38.sv A0-GPU/rtl/graphics/a0_p68_depth_compare.sv A0-GPU/rtl/graphics/a0_p70_rgb_blend.sv A0-GPU/rtl/graphics/a0_p138_dual_bank_framebuffer.sv A0-GPU/rtl/graphics/a0_p139_xy_dual_pixel_port.sv A0-GPU/rtl/graphics/a0_p144_dual_depth_blend_rmw.sv A0-GPU/rtl/graphics/a0_p164_affine_vertex_uv.sv A0-GPU/rtl/graphics/a0_p166_perspective_vertex_uv.sv A0-GPU/rtl/graphics/a0_p163_programmed_fragment_core.sv A0-GPU/rtl/graphics/a0_p163_packed_programmed_command_top.sv; hierarchy -check -top a0_p163_packed_programmed_command_top; synth_ecp5 -top a0_p163_packed_programmed_command_top -json EVIDENCE/P168/route/netlist.json; check -assert" 2>&1 | tee EVIDENCE/P168/route/yosys.log
          nextpnr-ecp5 --85k --package CABGA756 --speed 6 \
            --json EVIDENCE/P168/route/netlist.json \
            --textcfg EVIDENCE/P168/route/route.config \
            --report EVIDENCE/P168/route/route.json \
            --freq 5 --lpf-allow-unconstrained --seed 1 \
            2>&1 | tee EVIDENCE/P168/route/nextpnr.log
          python3 - <<'PY'
          import collections,json
          from pathlib import Path
          p=Path('EVIDENCE/P168/route')
          m=json.loads((p/'netlist.json').read_text())['modules']['a0_p163_packed_programmed_command_top']
          pins=sum(len(v['bits']) for v in m['ports'].values())
          c=collections.Counter(v['type'] for v in m['cells'].values())
          assert pins==77,('full host control bus must fit 77 real IO pins',pins)
          assert c.get('DP16KD',0)>=3,('P156 and P144 BRAM missing',c)
          assert c.get('MULT18X18D',0)>=40,('P162 texture or ALU DSP missing',c)
          assert c.get('MULT18X18D',0)<84,('P168 shared UV failed to beat P167 84 DSP baseline',c)
          assert not any(k.startswith('$') or k.startswith('a0_') or 'LATCH' in k.upper() for k in c),c
          fmax=json.loads((p/'route.json').read_text())['fmax']
          assert fmax and all(v['achieved']>=5 for v in fmax.values()),fmax
          print('P168_SHARED_UV_RESOURCE_ECP5_PASS pins=%d BRAM=%d DSP=%d'%(pins,c['DP16KD'],c['MULT18X18D']))
          PY
      - name: Preserve routed bitstream and mapped evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p168-real-programmed-raster-ecp5
          path: EVIDENCE/P168/route
          if-no-files-found: warn
