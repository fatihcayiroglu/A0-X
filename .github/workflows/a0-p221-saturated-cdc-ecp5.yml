          yosys -Q -T -p 'read_verilog -sv A0-GPU/rtl/memory/a0_p203_tagged_controller_bridge.sv A0-GPU/rtl/memory/a0_p205_narrow_p203_mailbox.sv A0-GPU/rtl/memory/a0_p206_committed_bram_top.sv A0-GPU/rtl/memory/a0_p207_two_bram_banks.sv A0-GPU/rtl/memory/a0_p208_frame_publication_fence.sv A0-GPU/rtl/display/a0_p209_independent_scanout.sv A0-GPU/rtl/display/a0_p210_frame_boundary_stream.sv A0-GPU/rtl/display/a0_p211_bounded_raster_timing.sv A0-GPU/rtl/display/a0_p212_gray_async_fifo.sv A0-GPU/rtl/display/a0_p212_async_frame_queue.sv A0-GPU/rtl/display/a0_p213_atomic_pixel_raster.sv A0-GPU/rtl/display/a0_p215_supervised_pixel_raster.sv A0-GPU/rtl/display/a0_p216_domain_local_reset_raster.sv; hierarchy -check -top a0_p216_domain_local_reset_raster; synth_ecp5 -top a0_p216_domain_local_reset_raster -json EVIDENCE/P221/route/netlist.json; check -assert; stat' \
            2>&1 | tee EVIDENCE/P221/route/yosys_ecp5.log
          grep -q 'Found and reported 0 problems.' EVIDENCE/P221/route/yosys_ecp5.log
          timeout 1500s nextpnr-ecp5 --85k --package CABGA381 --speed 6 \
            --json EVIDENCE/P221/route/netlist.json \
            --textcfg EVIDENCE/P221/route/route.config \
            --report EVIDENCE/P221/route/route.json \
            --freq 10 --lpf-allow-unconstrained --seed 1 \
            2>&1 | tee EVIDENCE/P221/route/nextpnr.log
          python3 - <<'PY'
          import collections,json
          from pathlib import Path
          p=Path('EVIDENCE/P221/route')
          top=json.loads((p/'netlist.json').read_text())['modules']['a0_p216_domain_local_reset_raster']
          pins=sum(len(v['bits']) for v in top['ports'].values())
          cells=collections.Counter(v['type'] for v in top['cells'].values())
          assert pins==83,('P216 top requires exactly 83 I/O bits',pins)
          assert cells.get('DP16KD',0)>=21,('P216 must preserve 15 upstream EBR plus two scrubbed pixel-local banks',cells)
          assert cells.get('LUT4',0)>0 and cells.get('TRELLIS_FF',0)>=4200,('missing pixel-domain staging control',cells)
          assert not any(k.startswith('$') or k.startswith('a0_') or 'LATCH' in k.upper() for k in cells),('unmapped/blackbox/latch cells',cells)
          fmax=json.loads((p/'route.json').read_text()).get('fmax',{})
          assert fmax and all(v.get('achieved',0)>0 for v in fmax.values()),('no physical clock route',fmax)
          assert any('host_clk' in k for k in fmax),('host clock absent from physical route',fmax)
          assert any('pixel_clk' in k for k in fmax),('pixel clock absent from physical route',fmax)
          achieved=min(v['achieved'] for v in fmax.values())
          assert achieved>=10.0,('routed frequency below 10 MHz experimental floor',fmax)
          print('P218_REAL_CDC_INVENTORY_ROUTE_PASS package=CABGA381 pins=%d EBR=%d LUT4=%d FF=%d MHz=%.2f'%(pins,cells['DP16KD'],cells['LUT4'],cells['TRELLIS_FF'],achieved))
          PY
      - name: Verify independently routed host and pixel clock contract
        run: |
          set -euo pipefail
          python3 A0-GPU/tests/rtl/a0_p218_cdc_inventory_gate.py \
            --route EVIDENCE/P221/route/route.json \
            --output EVIDENCE/P221/cdc/inventory.json \
            | tee EVIDENCE/P221/cdc/routed_audit.log
          grep -q '^P218_DUAL_CLOCK_ROUTE_CONTRACT_PASS host_mhz=[0-9.]* pixel_mhz=[0-9.]* floor_mhz=10.00 board_signoff=0$' \
            EVIDENCE/P221/cdc/routed_audit.log
      - name: Preserve first-failure output without retries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p221-saturated-queue-evidence
          path: EVIDENCE/P221
          if-no-files-found: warn
