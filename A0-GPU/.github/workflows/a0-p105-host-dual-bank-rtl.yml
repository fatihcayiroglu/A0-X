name: A0-X P105 host/dual-bank RTL (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p105-real-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          iverilog -V | head -n 2
      - name: Strict P104 predecessor RTL gate
        working-directory: A0-GPU
        run: python3 tests/run_p104_dual_bank.py
      - name: Strict P105 integration RTL gate
        working-directory: A0-GPU
        run: python3 tests/run_p105_host_dual_bank.py
      - name: Python model regression (not RTL)
        working-directory: A0-GPU
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q
