name: A0-X P125 eighteen mandatory real RTL gates
on:
  push:
    paths:
      - 'A0-GPU/**'
      - '.github/workflows/a0-p125-18-gate-real-rtl.yml'
  pull_request:
    paths:
      - 'A0-GPU/**'
      - '.github/workflows/a0-p125-18-gate-real-rtl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p125-eighteen-real-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install actual HDL simulator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog
          command -v iverilog
          command -v vvp
          iverilog -V
      - name: Verify host-side expected bytes and adversarial controls (NOT proof of RTL)
        run: |
          set -euo pipefail
          for n in 117 118 120 121 122 123 124 125; do
            PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s A0-GPU/tests -p "test_p${n}_*.py" -v
          done
      - name: Run and independently validate all 18 actual RTL gates (no skips)
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B A0-GPU/tools/a0_p125_rtl_qualification.py --evidence EVIDENCE/P125/rtl_qualification
      - name: Verify chain of evidence and source integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=json.loads(Path('EVIDENCE/P125/rtl_qualification/qualification.json').read_text())
          assert p['status']=='PASS' and p['qualified'] is True
          assert p['expected_gates']==18 and p['execution_mode']=='REAL_SUBPROCESS'
          assert p['p124_status']=='PASS' and p['p124_evidence_valid'] is True
          assert p['p125_status']=='PASS' and p['sources_unchanged'] is True
          assert p['physical_gpu_qualified'] is False
          PY
      - name: Upload logs and qualification report on PASS or FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-p125-18-real-rtl-evidence
          path: EVIDENCE/P125/rtl_qualification/
          if-no-files-found: warn
