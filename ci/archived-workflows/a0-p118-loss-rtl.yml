name: A0-X P118 loss-aware RTL qualification (manual)
on:
  workflow_dispatch:
jobs:
  p118-real-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: P118 FIFO lost-tail HDL
        run: cd A0-GPU && python3 tests/run_p118_loss_fifo.py
      - name: P118 two-frame regression HDL
        run: cd A0-GPU && python3 tests/run_p118_host_loss_e2e.py
      - name: P118 software reference tests
        run: cd A0-GPU && PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_p118_*.py' -v
